name: build

on:
  push:
    branches: [master]
  pull_request:

# A push that supersedes a running build makes that build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OCAML_VERSION: "5.4.1"
  ANDROID_API: "26"

jobs:
  compiler:
    name: cross compiler
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        # Slow to build and rarely changing: rekey only when the compiler or the
        # toolchain packages do, not when a library package changes.
        run: |
          echo "value=opam-${{ runner.os }}-ocaml${{ env.OCAML_VERSION }}-$(
            git ls-files -s packages/ocaml-android64 packages/ocaml-android \
                           packages/conf-ndk-android packages/build-android-sysroot \
              | sha256sum | cut -c1-16
          )" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-cross
        id: setup
        with:
          ocaml-version: ${{ env.OCAML_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          cache-key: ${{ steps.key.outputs.value }}
          cache-read-only: "false"

      - name: Build the cross compiler
        if: steps.setup.outputs.cache-hit != 'true'
        env:
          TOOLPREF64: ${{ steps.setup.outputs.toolpref }}
        run: opam install -y ocaml-android64

  affected:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the merge base rather than a shallow tip.
          fetch-depth: 0

      - name: Lint every package
        run: opam lint packages/*/*/opam

      - name: Changed packages, and what depends on them
        id: list
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A first push to a branch, or a force push, leaves no usable base.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi

          changed=$(git diff --name-only "$base"...HEAD -- packages/ \
                    | cut -d/ -f2 | sort -u)
          if [ -z "$changed" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            echo "Nothing under packages/ changed."
            exit 0
          fi
          echo "Changed:"; printf '  %s\n' $changed

          opam repository add android . --set-default >/dev/null 2>&1 || true

          # A package is only proven by what builds against it, so take the
          # reverse dependency closure rather than the changed packages alone.
          #
          # --depopts is not optional here: a conf-<lib> is an *optional*
          # dependency of its consumer, so without it a change to
          # conf-libev-android would rebuild nothing at all, when what it has to
          # prove is that lwt still picks the library up.
          affected=$(for p in $changed; do
                       echo "$p"
                       opam admin list --depends-on "$p" --recursive --depopts --short 2>/dev/null || true
                     done | sort -u)

          echo "Affected:"; printf '  %s\n' $affected
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "packages=$(printf '%s\n' $affected | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }}
    needs: [compiler, affected]
    if: needs.affected.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One broken package should not hide the state of the others.
      fail-fast: false
      # Each job resolves its own dependency chain, so the pool is bounded to
      # keep a wide change from monopolising the runners.
      max-parallel: 8
      matrix:
        package: ${{ fromJson(needs.affected.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cross
        id: setup
        with:
          ocaml-version: ${{ env.OCAML_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          cache-key: ${{ needs.compiler.outputs.cache-key }}

      - name: Install ${{ matrix.package }}
        env:
          TOOLPREF64: ${{ steps.setup.outputs.toolpref }}
        # No --with-test: these packages cross-compile, so their suites would
        # have to run on a device.
        run: opam install -y ${{ matrix.package }}
